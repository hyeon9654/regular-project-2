plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bank'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 API (Boot 4부터 starter-web 대신 starter-webmvc)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 권한 확인
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 요청 값 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // DB (원장, 감사 로그)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 감사 로그 AOP (Boot 4부터 starter-aop 대신 starter-aspectj)
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // DB 드라이버
    runtimeOnly 'org.postgresql:postgresql'         // 운영 (RDS PostgreSQL)
    runtimeOnly 'com.h2database:h2'                 // 로컬 연습용

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 (Boot 4부터 기능별 테스트 starter)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
