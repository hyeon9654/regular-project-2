server:
  port: 8081

spring:
  application:
    name: internal-server

  # 로컬 연습용: 메모리 DB(H2). 서버를 끄면 데이터가 사라진다.
  # 운영에서는 RDS(PostgreSQL) 주소로 바꾸고, 계정 정보는 환경변수로 넣는다.
  #   url: jdbc:postgresql://<RDS 주소>:5432/bank
  #   driver-class-name: org.postgresql.Driver
  datasource:
    url: jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop     # 로컬 연습용. 운영에서는 validate 로 바꾼다.
    open-in-view: false

# 외부 서버와 같은 값이어야 외부 서버가 발급한 토큰을 검증할 수 있다.
# 뒤의 기본값은 로컬 연습용이다. 운영에서는 환경변수 JWT_SECRET 으로만 넣는다.
jwt:
  secret: "${JWT_SECRET:local-practice-only-secret-key-32bytes!!}"
