server:
  port: 8080

spring:
  application:
    name: external-server
  data:
    redis:
      repositories:
        enabled: false      # Redis 를 실제로 쓰기 전까지 저장소 자동 설정을 꺼 둔다

# 내부 서버 주소 (로컬은 localhost, AWS 에서는 내부 서버의 사설 IP)
core:
  url: http://localhost:8081

# 토큰 서명용 비밀키. 외부·내부 서버가 같은 값을 써야 한다.
# 뒤의 기본값은 로컬 연습용이다. 운영에서는 환경변수 JWT_SECRET 으로만 넣는다.
jwt:
  secret: "${JWT_SECRET:local-practice-only-secret-key-32bytes!!}"
